<h3>Carrinho de compras</h3>
<p>{{ nomeProduto }}</p>
<p>Preço: {{ preco | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}</p>
<p>
  Quantidade: {{ quantidade }}
  <button (click)="diminuir()" [disabled]="quantidade === 1">[-]</button>
  <button (click)="aumentar()">[+]</button>
</p>
<p>Total: {{ total | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}</p>
<button (click)="adicionarAoCarrinho()">Adicionar ao carrinho</button>

<p *ngIf="mensagem">{{ mensagem }}</p>
